name: Build learning dashboard data
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'config/**'
      - 'submissions/**'
      - 'progress/**'
      - 'instructor/reviews/**'
      - 'scripts/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate public dashboard data
        run: python scripts/build_dashboard.py
      - name: Commit generated data
        run: |
          if [[ -n "$(git status --porcelain docs/data)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data
            git commit -m "chore: refresh learning dashboard data"
            git push
          fi
